<!DOCTYPE html>
<html>
<head>
    <title>QUEST — Scouted Pull</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 60px auto; }
        .action { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
                  border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 16px; }
        .action:hover { background: #f5f5f5; }
        .turn-banner { background: #d1e7ff; border: 1px solid #4a90d9; border-radius: 6px;
                        padding: 8px 12px; margin-bottom: 12px; font-weight: bold; }
    </style>
</head>
<body>
    {% if turn_label %}<div class="turn-banner">{{ turn_label }}</div>{% endif %}
    <h2>Scouted Pull</h2>
    <p>Two candidates are revealed. Choose who you'll face:</p>
    <form method="POST" action="{{ action_url or '/scouted_pick/choose' }}">
        <button class="action" type="submit" name="pick" value="0">{{ candidates[0] }}</button>
        <button class="action" type="submit" name="pick" value="1">{{ candidates[1] }}</button>
    </form>
</body>
</html>
