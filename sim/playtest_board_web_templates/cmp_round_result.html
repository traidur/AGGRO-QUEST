<!DOCTYPE html>
<html>
<head>
    <title>QUEST — Round {{ round_num }} Results</title>
    <style>
        body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
        td, th { border: 1px solid #ccc; padding: 8px 10px; text-align: left; }
        button { font-size: 16px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Round {{ round_num }} Results</h2>
    <table>
        <tr><th>Hero</th><th>Outcome</th><th>HP</th><th>Gold</th><th>XP</th><th>Position</th></tr>
        {% for row in rows %}
        <tr><td>{{ row.label }}</td><td>{{ row.outcome }}</td><td>{{ row.hp }}</td>
            <td>{{ row.gold }}</td><td>{{ row.xp }}</td><td>{{ row.position }}</td></tr>
        {% endfor %}
    </table>
    <form method="POST" action="/cmp/round_result/continue">
        <button type="submit">Continue to next round</button>
    </form>
</body>
</html>
