<!DOCTYPE html>
<html>
<head>
    <title>QUEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <h1>QUEST</h1>
    <form method="POST" action="/start">
        <label>Class</label>
        <select name="class_name">
            {% for c in classes %}<option value="{{ c }}">{{ c|capitalize }}</option>{% endfor %}
        </select>
        <label>Seed (optional)</label>
        <input type="text" name="seed" placeholder="leave blank for random">
        <button type="submit">Begin Solo Game</button>
    </form>
    
    <div style="text-align: center; margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <h2 style="font-size: 18px; border: none;">Multiplayer</h2>
        <p style="font-size: 14px; color: var(--text-muted);">Want to play against friends or AI bots?</p>
        <a href="/party" style="display: inline-block; background: #222; color: var(--accent-gold); padding: 8px 16px; border: 1px solid var(--accent-gold); border-radius: 4px; text-decoration: none; font-family: 'Cinzel', serif; font-size: 14px; text-transform: uppercase;">Host Competitive Game</a>
    </div>
</body>
</html>
