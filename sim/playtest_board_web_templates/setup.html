<!DOCTYPE html>
<html>
<head>
    <title>QUEST</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
    <h1>QUEST</h1>
    <form method="POST" action="/start">
        <label>Class</label>
        <select name="class_name">
            {% for c in classes %}<option value="{{ c }}">{{ c|capitalize }}</option>{% endfor %}
        </select>
        <label>Seed (optional)</label>
        <input type="text" name="seed" placeholder="leave blank for random">
        <button type="submit">Begin</button>
    </form>
</body>
</html>
