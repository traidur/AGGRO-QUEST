<!DOCTYPE html>
<html>
<head>
    <title>QUEST — Town</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

    {% include "_hero_sidebar.html" %}

    {% if turn_label %}<div class="turn-banner">{{ turn_label }}</div>{% endif %}
    <h2>Town — Zone {{ hero.position[0] }}</h2>
    {% for msg in flash %}<div class="flash">{{ msg }}</div>{% endfor %}

    <br>
    {% for i, a in actions %}
    <form method="POST" action="{{ action_url or '/town/action' }}" style="display:inline;">
        <input type="hidden" name="idx" value="{{ i }}">
        <button class="action-btn" type="submit">
            {% if a.type == 'leave_town' %}Leave Town
            {% elif a.type == 'buy' %}Buy {{ a.tag }} ({{ a.kind }}) — {{ a.cost }}g
            {% elif a.type == 'buy_consumable' %}Buy {{ a.item_name }} — {{ a.cost }}g
            {% elif a.type == 'use_charm' %}Use Preserving Charm on {{ a.loot }} (reset decay)
            {% else %}{{ a }}
            {% endif %}
        </button>
    </form>
    {% endfor %}
</body>
</html>
