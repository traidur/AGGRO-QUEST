<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUEST — PnP Card Printer</title>
  </head>
  <body>
    <div id="app">
      <header class="ui-bar">
        <h1>QUEST <span>PnP Card Printer</span></h1>
        
        <div class="filters">
          <!-- Class filters generated by JS -->
          <div id="class-filters"></div>
        </div>

        <div class="actions" style="display: flex; align-items: center;">
          <a href="/" class="btn" style="text-decoration: none; margin-right: 12px; background: #37474F;">Home</a>
          <a href="/mobs.html" class="btn" style="text-decoration: none; margin-right: 12px; background: #37474F;">Mob Deck</a>
          <button id="btn-images" class="btn" style="background:#444;color:white;margin-right:8px;border:none;border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:bold;">🖼️ Images: OFF</button>
          <button id="btn-mode" class="btn" style="background:#4A148C;color:white;margin-right:8px;border:none;border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:bold;">🎨 Production</button>
          <button id="btn-print" class="btn btn-primary">Print Sheets</button>
        </div>
      </header>

      <main class="sheet-container" id="sheet-container">
        <!-- Sheets generated here -->
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
