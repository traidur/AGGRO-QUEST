<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QUEST Spice Deck Print Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/spice.css">
  </head>
  <body>
    <div class="ui-bar" id="uiBar">
      <div class="ui-left">
        <h1 style="color: white; font-family: 'Cinzel', serif; margin-right: 20px; font-size: 16pt;">QUEST Spice Deck</h1>
        <div id="filterControls" class="filter-controls">
          <button class="btn btn-filter active" data-type="all">All 16 Cards</button>
          <button class="btn btn-filter" data-type="event">Adventure Events (12)</button>
          <button class="btn btn-filter" data-type="combat">Wilderness Combats (4)</button>
        </div>
        <div style="display: flex; gap: 8px; margin-left: 20px; align-items: center;">
          <label style="color: #fff; font-size: 14px; font-weight: bold; font-family: 'Barlow Condensed', sans-serif;">COPIES:</label>
          <input type="number" id="qtyMultiplier" value="1" min="1" max="5" style="width: 45px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; padding: 3px 6px; font-weight: bold;">
        </div>
      </div>
      <div class="ui-right">
        <a href="/" class="btn" style="text-decoration: none; margin-right: 8px; background: #37474F;">Home</a>
        <a href="/mobs.html" class="btn" style="text-decoration: none; margin-right: 8px; background: #37474F;">Mob Deck</a>
        <a href="/quests.html" class="btn" style="text-decoration: none; margin-right: 8px; background: #37474F;">Items Deck</a>
        <button class="btn btn-primary" onclick="window.print()">Print Spice Cards</button>
      </div>
    </div>
    <div class="sheet-container" id="sheetsContainer"></div>
    <script type="module" src="/src/spice.js"></script>
  </body>
</html>
